  mcp-memory-bank:
    build: ./memory-bank
    restart: unless-stopped
    container_name: mcp-memory-bank
    environment:
      - MEMORY_BANK_ROOT=/opt/memory-bank
    volumes:
      - ../workspace/memory-bank:/opt/memory-bank
    healthcheck:
      # ncでポートが開いているか確認
      test: ["CMD", "nc", "-z", "localhost", "8000"]
